openapi: 3.1.0
info:
  title: Library API
  version: 1.0.0
  description: |
    API для управления библиотекой: книги, читатели и выдачи.
    Contract-first: спецификация согласована до реализации.

servers:
  - url: https://api.library.example.com/v1
    description: Production
  - url: https://staging.library.example.com/v1
    description: Staging

tags:
  - name: Books
    description: Управление книгами
  - name: Readers
    description: Управление читателями
  - name: Loans
    description: Выдачи книг

paths:
  /books:
    get:
      tags: [Books]
      summary: Список книг
      description: |
        Возвращает постраничный список книг.
        Поддерживает фильтр по автору и наличию, сортировку и пагинацию.
      operationId: listBooks
      parameters:
        - name: author
          in: query
          description: Фильтр по автору (частичное совпадение)
          schema: { type: string }
        - name: available
          in: query
          description: true — только книги с available_copies > 0
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Список книг
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookList' }
              example:
                data:
                  - id: 1
                    title: "Мастер и Маргарита"
                    author: "Михаил Булгаков"
                    isbn: "978-5-04-116257-2"
                    published_year: 1967
                    total_copies: 5
                    available_copies: 3
                pagination:
                  total: 1
                  limit: 20
                  offset: 0
                  has_more: false
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Books]
      summary: Добавить книгу
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookRequest' }
            example:
              title: "Преступление и наказание"
              author: "Фёдор Достоевский"
              isbn: "978-5-04-118544-1"
              published_year: 1866
              total_copies: 3
      responses:
        '201':
          description: Книга создана
          headers:
            Location:
              description: URL созданной книги
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Books]
      summary: Получить книгу по id
      operationId: getBook
      responses:
        '200':
          description: Книга
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Books]
      summary: Обновить книгу
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookRequest' }
      responses:
        '200':
          description: Обновлённая книга
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Books]
      summary: Удалить книгу
      description: |
        Удаление невозможно, если по книге есть активные выдачи
        (returned_at == null). В этом случае сервер возвращает 409.
      operationId: deleteBook
      responses:
        '204':
          description: Книга удалена
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: У книги есть активные выдачи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: BUSINESS_RULE_VIOLATION
                  message: "Нельзя удалить книгу с активными выдачами"
                  details:
                    - field: book_id
                      issue: active_loans
                      message: "По книге есть невозвращённые экземпляры"
                  request_id: "req_409_book_del"

  /readers:
    get:
      tags: [Readers]
      summary: Список читателей
      operationId: listReaders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Список читателей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Readers]
      summary: Добавить читателя
      operationId: createReader
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReaderRequest' }
            example:
              full_name: "Анна Смирнова"
              email: "anna@example.com"
      responses:
        '201':
          description: Читатель создан
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reader' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /readers/{id}:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Readers]
      summary: Получить читателя
      operationId: getReader
      responses:
        '200':
          description: Читатель
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reader' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Readers]
      summary: Обновить читателя
      operationId: updateReader
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReaderRequest' }
      responses:
        '200':
          description: Обновлённый читатель
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reader' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Readers]
      summary: Удалить читателя
      description: |
        Удаление невозможно, если у читателя есть активные выдачи.
      operationId: deleteReader
      responses:
        '204':
          description: Читатель удалён
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: У читателя есть активные выдачи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: BUSINESS_RULE_VIOLATION
                  message: "Нельзя удалить читателя с активными выдачами"
                  request_id: "req_409_reader_del"

  /loans:
    get:
      tags: [Loans]
      summary: Список выдач
      description: |
        Возвращает постраничный список выдач.
        Параметр status=overdue возвращает просроченные выдачи:
        returned_at == null и due_date < сегодня.
      operationId: listLoans
      parameters:
        - name: status
          in: query
          description: |
            Фильтр по статусу:
            - active — returned_at == null и due_date >= сегодня
            - returned — returned_at != null
            - overdue — returned_at == null и due_date < сегодня
          schema:
            type: string
            enum: [active, returned, overdue]
        - name: reader_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: book_id
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Список выдач
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanList' }
              example:
                data:
                  - id: 10
                    book_id: 1
                    reader_id: 5
                    loaned_at: "2025-01-10T09:15:00Z"
                    due_date: "2025-02-10"
                    returned_at: null
                pagination:
                  total: 1
                  limit: 20
                  offset: 0
                  has_more: false
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Loans]
      summary: Создать выдачу
      description: |
        Создаёт выдачу книги читателю.

        Бизнес-правила:
        - Книга и читатель должны существовать (404).
        - available_copies > 0, иначе 409 BUSINESS_RULE_VIOLATION.
        - У читателя не более 5 активных выдач, иначе 409 BUSINESS_RULE_VIOLATION.
        - due_date должна быть строго позже текущей даты, иначе 422 VALIDATION_ERROR.

        Идемпотентность (Idempotency-Key):
        - Первый запрос с новым ключом — обычный успех, 201.
        - Повтор с тем же ключом и тем же телом — полный replay ответа,
          без второй выдачи.
        - Тот же ключ, другое тело — 409 IDEMPOTENCY_MISMATCH.
        - Конкурентные повторы с одним ключом — сервер сериализует,
          второй получает replay первого.
        - Срок хранения ключа — 24 часа; после истечения ключ считается новым.
      operationId: createLoan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLoanRequest' }
            example:
              book_id: 1
              reader_id: 5
              due_date: "2025-12-01"
      responses:
        '201':
          description: Выдача создана
          headers:
            Location:
              description: URL созданной выдачи
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
              example:
                id: 10
                book_id: 1
                reader_id: 5
                loaned_at: "2025-11-01T12:00:00Z"
                due_date: "2025-12-01"
                returned_at: null
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Конфликт состояния или идемпотентности
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                no_copies:
                  summary: Нет доступных копий
                  value:
                    error:
                      code: BUSINESS_RULE_VIOLATION
                      message: "Недостаточно доступных копий"
                      request_id: "req_409_no_copies"
                too_many_loans:
                  summary: Превышен лимит активных выдач
                  value:
                    error:
                      code: BUSINESS_RULE_VIOLATION
                      message: "Читатель уже имеет 5 активных выдач"
                      details:
                        - field: reader_id
                          issue: active_loans_limit
                          message: "Не более 5 активных выдач"
                      request_id: "req_409_limit"
                idempotency_mismatch:
                  summary: Тот же Idempotency-Key, другое тело
                  value:
                    error:
                      code: IDEMPOTENCY_MISMATCH
                      message: "Idempotency-Key уже использован с другим телом"
                      request_id: "req_409_idem"
        '422':
          description: Ошибка валидации (например, due_date в прошлом)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: "Некорректные данные запроса"
                  details:
                    - field: due_date
                      issue: minimum
                      message: "Дата возврата должна быть в будущем"
                  request_id: "req_422_due"

  /loans/{id}:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Loans]
      summary: Получить выдачу
      operationId: getLoan
      responses:
        '200':
          description: Выдача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }

  /loans/{id}/return:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Вернуть книгу
      description: |
        Возврат книги по выдаче. Не DELETE — осознанное действие над ресурсом.
        После успешного возврата returned_at заполняется, а available_copies
        соответствующей книги увеличивается на 1.
      operationId: returnLoan
      responses:
        '200':
          description: Книга возвращена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
              example:
                id: 10
                book_id: 1
                reader_id: 5
                loaned_at: "2025-11-01T12:00:00Z"
                due_date: "2025-12-01"
                returned_at: "2025-11-20T15:30:00Z"
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Книга уже возвращена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: CONFLICT
                  message: "Выдача уже закрыта"
                  request_id: "req_409_return"

components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить
      schema: { type: integer, minimum: 0, default: 0 }
    Sort:
      name: sort
      in: query
      description: |
        Поле сортировки. Префикс "-" — по убыванию.
        Пример: sort=-created_at
      schema: { type: string, default: "id" }
    BookId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ReaderId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    LoanId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Уникальный ключ одной логической операции создания выдачи (UUID).
        Повтор с тем же ключом и телом не создаёт вторую выдачу.
        TTL ключа — 24 часа.
      schema:
        type: string
        format: uuid

  schemas:
    Book:
      type: object
      required: [id, title, author, isbn, published_year, total_copies, available_copies]
      properties:
        id: { type: integer }
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string }
        published_year: { type: integer, minimum: 0 }
        total_copies: { type: integer, minimum: 0 }
        available_copies:
          type: integer
          minimum: 0
          readOnly: true
          description: Вычисляется сервером из total_copies и активных выдач

    CreateBookRequest:
      type: object
      required: [title, author, isbn]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string, minLength: 1 }
        published_year: { type: integer, minimum: 0 }
        total_copies: { type: integer, minimum: 0 }

    UpdateBookRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string, minLength: 1 }
        published_year: { type: integer, minimum: 0 }
        total_copies: { type: integer, minimum: 0 }

    Reader:
      type: object
      required: [id, full_name, email, registered_at]
      properties:
        id: { type: integer }
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        registered_at: { type: string, format: date-time }

    CreateReaderRequest:
      type: object
      required: [full_name, email]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }

    UpdateReaderRequest:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }

    Loan:
      type: object
      required: [id, book_id, reader_id, loaned_at, due_date, returned_at]
      properties:
        id: { type: integer }
        book_id: { type: integer }
        reader_id: { type: integer }
        loaned_at: { type: string, format: date-time }
        due_date: { type: string, format: date }
        returned_at:
          type: [string, "null"]
          format: date-time
          description: null, пока выдача активна
          
    CreateLoanRequest:
      type: object
      required: [book_id, reader_id, due_date]
      additionalProperties: false
      properties:
        book_id: { type: integer, minimum: 1 }
        reader_id: { type: integer, minimum: 1 }
        due_date:
          type: string
          format: date
          description: Должна быть строго позже текущей даты

    BookList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    ReaderList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Reader' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    LoanList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Loan' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Pagination:
      type: object
      required: [total, limit, offset, has_more]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - NOT_FOUND
                - VALIDATION_ERROR
                - CONFLICT
                - BUSINESS_RULE_VIOLATION
                - IDEMPOTENCY_MISMATCH
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue, message]
                properties:
                  field: { type: string }
                  issue: { type: string }
                  message: { type: string }
            request_id: { type: string }

  responses:
    BadRequest:
      description: Некорректный запрос (битый JSON, неверный query)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: INVALID_REQUEST
              message: "Некорректный query-параметр"
              request_id: "req_400_example"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: NOT_FOUND
              message: "Ресурс не найден"
              request_id: "req_404_example"
    ValidationError:
      description: Ошибка валидации (синтаксис корректен, правила нарушены)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: "Некорректные данные запроса"
              details:
                - field: title
                  issue: minLength
                  message: "Название не может быть пустым"
              request_id: "req_422_example"